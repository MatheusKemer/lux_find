[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lux_find"
version = "0.2.0"
description = "Full-text search over the notes, code and chats you already have. No server, no cloud, no dependencies."
authors = [{ name = "Matheus Kemer" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["search", "fts5", "sqlite", "bm25", "local-first", "notes", "agents", "retrieval"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lux-find = "lux_find.cli:main"

[project.urls]
Homepage = "https://matheuskemer.github.io/lux_find/"
Repository = "https://github.com/MatheusKemer/lux_find"
Issues = "https://github.com/MatheusKemer/lux_find/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
